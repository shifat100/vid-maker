<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <title>J2ME</title>
  <link rel="stylesheet" type="text/css" href="style/main.css">
  <link rel="stylesheet" type="text/css" href="style/lcdui.css">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151b">
  <style id="kaios-main-style">
    .kaios-softkeys[hidden], #kaios-toast[hidden], #t9-hud[hidden] { display: none !important; }
    .kaios-softkeys {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 26px;
      background: #181d26;
      border-top: 1px solid #2e3748;
      color: #eef2f7;
      display: flex;
      align-items: center;
      padding: 0 6px;
      font-size: 11px;
      line-height: 1;
      z-index: 60;
      box-sizing: border-box;
      user-select: none;
    }
    .kaios-sk-btn {
      flex: 1 1 33%;
      background: transparent;
      border: 0;
      color: inherit;
      font: inherit;
      padding: 4px 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .kaios-sk-left { text-align: left; font-weight: 600; }
    .kaios-sk-center { text-align: center; font-weight: 700; text-transform: uppercase; }
    .kaios-sk-right { text-align: right; font-weight: 600; }
    #kaios-toast {
      position: fixed;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      background: rgba(18, 21, 27, 0.88);
      color: #eef2f7;
      border: 1px solid #394457;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 11px;
      white-space: nowrap;
      z-index: 55;
      pointer-events: none;
    }
    #t9-hud {
      position: fixed;
      top: 4px;
      right: 4px;
      background: rgba(18, 21, 27, 0.9);
      color: #9ecbff;
      border: 1px solid #394457;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 700;
      z-index: 70;
      pointer-events: none;
    }
    .kbd-focus {
      outline: 2px solid #4da3ff !important;
      outline-offset: -1px;
    }
    body.kaios-ui.keypad-hidden #gear:not(.on) {
      width: 22px;
      height: 22px;
      opacity: 0.28;
      font-size: 12px;
      padding: 0;
    }
    body.keypad-hidden #keypad {
      display: none !important;
    }

    @media (max-width: 360px), (max-height: 360px) {
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden !important;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #display-container {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #editor-layer {
        max-width: 100vw;
        box-sizing: border-box;
      }
      #editor-layer .textEditor {
        max-width: calc(100vw - 8px) !important;
        box-sizing: border-box !important;
        font-size: 14px !important;
      }
      #panel, #files {
        padding: 0 !important;
        box-sizing: border-box !important;
      }
      #panel .panel-box, #files .fm-box {
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        max-height: 100% !important;
        border-radius: 0 !important;
        border: 0 !important;
        margin: 0 !important;
        padding: 8px 8px 34px !important;
        box-sizing: border-box !important;
        font-size: 13px !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
      }
      .pb-head {
        margin-bottom: 6px !important;
        padding-bottom: 5px !important;
      }
      .pb-title b { font-size: 13px !important; }
      .pb-title span { font-size: 10px !important; }
      .pb-close {
        min-width: 26px !important;
        height: 26px !important;
        font-size: 13px !important;
      }
      .panel-box section, .fm-box section {
        margin-bottom: 10px !important;
      }
      .panel-box h3 {
        font-size: 11px !important;
        margin: 0 0 5px !important;
      }
      .scr-size { font-size: 16px !important; }
      .seg { display: flex !important; flex-wrap: nowrap !important; }
      .seg button {
        flex: 1 1 0;
        padding: 5px 4px !important;
        font-size: 11px !important;
      }
      .chips {
        display: flex !important;
        flex-wrap: wrap !important;
      }
      .chips .chip {
        margin: 0 4px 4px 0 !important;
        padding: 4px 7px !important;
        font-size: 11px !important;
      }
      .custom, .prop-add, .bt-actions, .fm-bar, .fm-new {
        display: flex !important;
        flex-wrap: wrap !important;
        align-items: center !important;
      }
      .custom > *, .prop-add > *, .bt-actions > *, .fm-bar > *, .fm-new > * {
        margin: 2px 4px 2px 0 !important;
      }
      .custom input {
        width: 54px !important;
        padding: 4px !important;
        font-size: 12px !important;
      }
      .opt, .prop {
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        margin-bottom: 6px !important;
      }
      .opt select, .prop input, .prop-add input, .fm-new input {
        width: 100% !important;
        max-width: 100% !important;
        padding: 5px 6px !important;
        font-size: 12px !important;
        box-sizing: border-box !important;
      }
      .fm-open, .fm-btn {
        width: 100%;
        padding: 6px 8px !important;
        font-size: 12px !important;
        margin-bottom: 5px !important;
        box-sizing: border-box !important;
      }
      .fm-bar .fm-btn { width: auto !important; flex: 1 1 auto; }
      .fm-row { padding: 3px 0 !important; }
      .fm-name { font-size: 12px !important; min-width: 0; }
      .fm-act { padding: 3px 6px !important; font-size: 12px !important; }
      .screen-hint {
        left: 4px !important;
        right: 4px !important;
        bottom: 6px !important;
        width: auto !important;
        max-width: none !important;
        padding: 6px 8px !important;
        font-size: 11px !important;
        display: flex !important;
        flex-wrap: wrap !important;
        align-items: center !important;
        box-sizing: border-box !important;
      }
      .screen-hint span {
        flex: 1 1 100%;
        margin-bottom: 4px;
      }
      .screen-hint button {
        padding: 4px 8px !important;
        font-size: 11px !important;
        margin-right: 6px !important;
      }
      #keypad:not(.keypad-0) {
        flex: 0 0 auto;
        width: 100% !important;
        padding: 3px 4px !important;
        box-sizing: border-box !important;
      }
      #keypad:not(.keypad-0) .key {
        padding: 3px 2px !important;
        font-size: 11px !important;
        min-height: 24px !important;
      }
      #keypad:not(.keypad-0) .key i { font-size: 8px !important; }
    }
  </style>
  <script src="config/i18n.js"></script>
  <script src="libs/encoding.js"></script>
  <script src="./libs/webaudio-tinysynth.min.js" type="text/javascript"></script>
  <script src="./libs/BenzAMRRecorder.min.js" type="text/javascript"></script>

  <script type="text/javascript" src="bld/native.js" defer></script>
  <script type="text/javascript" src="config/default.js" defer></script>
  <script type="text/javascript" src="config/settings.js" defer></script>
  <script type="text/javascript" src="config/localjars.js" defer></script>
  <script type="text/javascript" src="config/urlparams.js" defer></script>
  <script type="text/javascript" src="screen.js" defer></script>

  <script type="text/javascript" src="bld/j2me.js" defer></script>

  <script type="text/javascript" src="bld/main-all.js" defer></script>
  <script type="text/javascript" src="bld/lcdui.js" defer></script>
  <script type="text/javascript" src="bld/net.js" defer></script>
  <script type="text/javascript" src="btroom.js" defer></script>
  <script type="text/javascript" src="bld/bt.js" defer></script>
  <script type="text/javascript" src="bld/media.js" defer></script>
  <script type="text/javascript" src="bld/micro3d.js" defer></script>
  <script type="text/javascript" src="bld/m3g.js" defer></script>
  <script type="text/javascript" src="files.js" defer></script>
  <script type="text/javascript" src="panel.js" defer></script>

  <script type="text/javascript" src="keymap.js"></script>

</head>

<body>
  <div id="editor-layer">
    <div id="textarea-editor" class="textEditor" contenteditable="true"></div>
    <input id="password-editor" class="textEditor" type="password">
    <input id="email-editor" class="textEditor" type="email">
    <input id="number-editor" class="textEditor" type="number">
    <input id="tel-editor" class="textEditor" type="tel">
    <input id="url-editor" class="textEditor" type="url">
  </div>
  <div id="display-container">
    <div id="display">
      <canvas id="canvas"></canvas>
      <div id="download-screen" class="screen">
        <h1 class="title" data-en="Loading…">Загрузка…</h1>
        <div class="download-progress-container">
          <progress class="pack-activity" id="download-bar" value="0" max="100"></progress>
        </div>
      </div>

      <div id="splash-screen" class="screen">
        <h1 class="title" data-en="Starting…">Запуск…</h1>
        <div class="splash-progress-container">
          <progress></progress>
        </div>
      </div>

      <div id="exit-screen" class="screen">
      </div>

      <div id="background-screen">
      </div>
    </div>
  </div>

  <div id="keypad">
    <div id="nav">
      <button id="choice" class="key soft"></button>
      <div id="dpad">
        <button id="up" class="key dir"></button>
        <button id="left" class="key dir"></button>
        <button id="ok" class="key"></button>
        <button id="right" class="key dir"></button>
        <button id="down" class="key dir"></button>
      </div>
      <button id="back" class="key soft"></button>
      <button id="ret" class="key mini" title="Назад" data-en-title="Back">↩</button>
      <button id="clear" class="key mini" title="Стереть" data-en-title="Clear">C</button>
    </div>
    <div id="numpad">
      <button id="num1" class="key"><b>1</b><i>.,?</i></button>
      <button id="num2" class="key"><b>2</b><i>abc</i></button>
      <button id="num3" class="key"><b>3</b><i>def</i></button>
      <button id="num4" class="key"><b>4</b><i>ghi</i></button>
      <button id="num5" class="key"><b>5</b><i>jkl</i></button>
      <button id="num6" class="key"><b>6</b><i>mno</i></button>
      <button id="num7" class="key"><b>7</b><i>pqrs</i></button>
      <button id="num8" class="key"><b>8</b><i>tuv</i></button>
      <button id="num9" class="key"><b>9</b><i>wxyz</i></button>
      <button id="star" class="key"><b>*</b><i>+</i></button>
      <button id="num0" class="key"><b>0</b><i>␣</i></button>
      <button id="pound" class="key"><b>#</b><i>⇧</i></button>
    </div>
  </div>
  <div id="t9-hud" hidden></div>
</body>

</html>
